# End-to-end suite against the live API (see tests/e2e/). Two kinds of legs:
#
# - source: the CLI built from the checked-out commit (main on the nightly),
#   with that commit's tests, on Linux, macOS and Windows. The backend gets
#   tested with the newest CLI before that CLI is released.
# - release: a published release, installed with its own installer, with the
#   tests from its own tag. The nightly takes the latest patch of each of the
#   last COMPAT_MINORS minor versions, on Linux: the backend must not break
#   CLIs people already have.
#
# Tests always match the binary they run against, so a merged but unreleased
# feature never needs a "skip until released" gate in the tests. The semantic
# and latency checks measure the backend, not the CLI, so they run once: on
# the Linux leg of the primary target (the source build, or the version given
# to a manual run).
#
# The suite isolates each run under a temp dir via KEENABLE_HOME (HOME alone
# does not isolate on Windows, where dirs::home_dir() queries the real
# profile). The daemon is Unix-only, so its tests self-skip on Windows; the
# shell-installer test does too.
#
# Not triggered by `release: published`: releases are created with
# GITHUB_TOKEN, which never triggers other workflows. To check a fresh release
# on every platform, run this manually with its version.

name: E2E

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release to test on every OS with its own tag's tests (e.g. 0.5.1). Empty = the nightly set: this branch built from source + recent releases."
        required: false
        default: ""
      test_alert:
        description: "Also fire the Slack alert on this manual run if e2e fails (for testing the notify job)."
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

# All legs share one KEENABLE_API_KEY; a manual run overlapping the nightly
# would trip the API's rate limit. Queue instead of running side by side.
concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Pick the legs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Via env, never interpolated into the script: a crafted dispatch
          # input must not be able to execute in this workflow.
          VERSION: ${{ inputs.version }}
          # How many minor versions back the nightly checks (latest patch of each).
          COMPAT_MINORS: "3"
        run: |
          set -euo pipefail
          # The semantic/latency checks run on one leg only (see the header).
          light="not semantic and not latency"
          oses="$(jq -cn --arg light "$light" '[
            {os: "ubuntu-latest", markers: ""},
            {os: "macos-latest", markers: $light},
            {os: "windows-latest", markers: $light}]')"

          if [ -n "$VERSION" ]; then
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version must be plain semver (e.g. 0.5.1), got: $VERSION"
              exit 1
            fi
            if ! gh release view "v$VERSION" --repo "$REPO" >/dev/null; then
              echo "::error::v$VERSION is not a published release"
              exit 1
            fi
            matrix="$(jq -c --arg v "$VERSION" '
              map(. + {name: "v\($v) · \(.os)", source: "release", version: $v, ref: "v\($v)"})
              | {include: .}' <<<"$oses")"
          else
            # Published (no drafts, no prereleases) plain-semver releases: the
            # latest patch of each minor, newest COMPAT_MINORS minors first.
            tags="$(gh release list --repo "$REPO" --exclude-drafts --exclude-pre-releases \
              --limit 200 --json tagName --jq '[.[].tagName]')"
            versions="$(jq -c --argjson n "$COMPAT_MINORS" '
              map(select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | ltrimstr("v"))
              | group_by(split(".")[0:2] | map(tonumber))
              | map(max_by(split(".") | map(tonumber)))
              | sort_by(split(".") | map(tonumber)) | reverse | .[:$n]' <<<"$tags")"
            echo "Releases under test: $versions"
            matrix="$(jq -c --argjson versions "$versions" --arg light "$light" '
              map(. + {name: "source · \(.os)", source: "source", version: "", ref: ""})
              + ($versions | map({name: "v\(.) · ubuntu-latest", os: "ubuntu-latest",
                                  markers: $light, source: "release", version: ., ref: "v\(.)"}))
              | {include: .}' <<<"$oses")"
          fi
          jq . <<<"$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  e2e:
    name: e2e (${{ matrix.name }})
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # One leg at a time: all legs share a single KEENABLE_API_KEY, and legs
      # hammering the live API in parallel trip its rate limit.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # Source legs build the CLI first (several minutes on macOS/Windows).
    timeout-minutes: 45
    steps:
      # A release leg checks out its own tag, so its tests describe exactly
      # that binary. A source leg checks out the triggering commit (ref "").
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false

      - name: Check API key secret
        shell: bash
        run: |
          if [ -z "${{ secrets.KEENABLE_API_KEY }}" ]; then
            echo "::error::KEENABLE_API_KEY secret is not set"
            exit 1
          fi

      # The Rust toolchain is preinstalled on GitHub runners (see ci.yml).
      # No cargo cache on purpose: a cold build takes 2-3 minutes per OS, and
      # a cache saved by a scheduled run (default-branch scope) after checking
      # out a non-default ref is a cache-poisoning path (CodeQL).
      - name: Build keenable CLI from source
        if: matrix.source == 'source'
        shell: bash
        run: |
          cargo build --release --locked
          exe=keenable
          [ "$RUNNER_OS" = Windows ] && exe=keenable.exe
          echo "KEENABLE_BIN=$GITHUB_WORKSPACE/target/release/$exe" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/target/release" >> "$GITHUB_PATH"

      - name: Install keenable CLI from GitHub Releases (Unix)
        if: matrix.source == 'release' && runner.os != 'Windows'
        shell: bash
        env:
          # From the plan job, which only emits plain semver. Via env, never
          # interpolated into the script.
          VERSION: ${{ matrix.version }}
        run: |
          URL="https://github.com/keenableai/keenable-cli/releases/download/v${VERSION}/keenable-cli-installer.sh"
          # Point the in-suite installer test at the same version under test.
          echo "KEENABLE_INSTALLER_URL=$URL" >> "$GITHUB_ENV"
          curl --proto '=https' --tlsv1.2 -LsSf --retry 3 "$URL" | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install keenable CLI from GitHub Releases (Windows)
        if: matrix.source == 'release' && runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ matrix.version }}
        run: |
          $ErrorActionPreference = "Stop"
          irm "https://github.com/keenableai/keenable-cli/releases/download/v$($env:VERSION)/keenable-cli-installer.ps1" | iex
          # install-path = CARGO_HOME, so the binary lands in ~\.cargo\bin.
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify binary under test
        run: keenable --version

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Run e2e suite
        shell: bash
        env:
          KEENABLE_API_KEY: ${{ secrets.KEENABLE_API_KEY }}
          # Tag every request from the suite as e2e traffic via the
          # X-Keenable-Title header (logged as app_title), so first-party CI
          # calls can be told apart from real CLI users (app_title=keenable-cli)
          # in Grafana. The CLI reads KEENABLE_APP_TITLE; the daemon inherits it.
          KEENABLE_APP_TITLE: keenable-cli-e2e
          # Empty on the primary Linux leg (full suite); "not semantic and not
          # latency" elsewhere, so the OS-independent live-index checks run once.
          MARKERS: ${{ matrix.markers }}
          SOURCE: ${{ matrix.source }}
          # Tests in released tags that the backend has since outdated on
          # purpose (a documented API change, not a regression), one pytest
          # node id per line, relative to tests/e2e (pytest's rootdir, from its
          # pyproject.toml; a tests/e2e/... prefix never matches). Release legs
          # deselect them; source legs never do,
          # since main's tests are fixed instead. This list lives here because
          # a release leg checks out its tag, which can't be edited. Remove an
          # entry once no release under test carries the old test.
          #
          # exclude_domains takes a public suffix with a leading dot (.gov,
          # *.gov), documented 2026-11-17 and live in pro search since
          # 2026-11-21; tags up to v0.6.0 still expect these to be rejected.
          RELEASE_DESELECT: |
            test_search.py::test_bad_exclude_entry_is_rejected_as_sent[.com]
            test_search.py::test_bad_exclude_entry_is_rejected_as_sent[.gov]
            test_search.py::test_bad_exclude_entry_is_rejected_as_sent[*.gov]
        run: |
          # The shell-installer test and daemon tests self-skip on Windows via
          # pytest skipif, so the same invocation works on every platform.
          args=(-v -ra --color=yes)
          [ -n "$MARKERS" ] && args+=(-m "$MARKERS")
          if [ "$SOURCE" = release ]; then
            while IFS= read -r id; do
              [ -n "$id" ] && args+=(--deselect "$id")
            done <<<"$RELEASE_DESELECT"
          fi
          uv run --project tests/e2e pytest tests/e2e "${args[@]}"

  # Alert Slack when any e2e leg does not succeed. Fires on the nightly
  # schedule (manual dispatch is interactive, so the operator already sees the
  # result) — or on a manual run started with test_alert=true, to verify the
  # notify path on demand without waiting for the cron. `result != 'success'`
  # covers failures and cancellations (the job timeout cancels rather than
  # fails), so timed-out nightly runs still alert, and a failed plan job too.
  # Needs the SLACK_WEBHOOK_URL repo secret (a Slack Incoming Webhook URL; the
  # target channel is fixed by the webhook). Self-skips if the secret is unset.
# The message names the legs that failed and what that kind of failure means.
  notify:
    name: notify-slack-on-failure
    needs: [plan, e2e]
    if: ${{ always() && (needs.plan.result != 'success' || needs.e2e.result != 'success') && (github.event_name == 'schedule' || inputs.test_alert) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read  # list this run's jobs to name the failed legs
    steps:
      - name: Post failure to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOBS_API: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL not set — skipping Slack alert"
            exit 0
          fi
          # One line per leg that did not succeed, e.g. "e2e (v0.5.1 · ubuntu-latest): failure".
          # Best effort: the alert still goes out if the jobs can't be listed.
          failed="$(gh api --paginate "$JOBS_API" --jq '.jobs[]
            | select(.name != "notify-slack-on-failure")
            | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped")
            | "• \(.name): \(.conclusion)"' || echo "• (could not list the jobs)")"
          # What each kind of failed leg means for whoever picks it up.
          meaning=""
          if grep -q "(source" <<<"$failed"; then
            meaning+=$'\n'"source legs: main's CLI fails against the live backend (a CLI regression, or the backend broke something main relies on)."
          fi
          if grep -q "(v[0-9]" <<<"$failed"; then
            meaning+=$'\n'"release legs: the live backend broke an already released CLI; fix the backend, users can't upgrade around it."
          fi
          if grep -q "plan" <<<"$failed"; then
            meaning+=$'\n'"plan: the legs could not be picked (GitHub API or release list)."
          fi
          # Build the payload with jq so every value is JSON-escaped, never
          # interpolated into the shell or the JSON string by hand.
          payload="$(jq -n \
            --arg repo "$REPO" \
            --arg url "$RUN_URL" \
            --arg failed "$failed" \
            --arg meaning "$meaning" \
            '{text: ("🔴 Nightly e2e failed for *" + $repo + "*\n" + $failed + "\n" + $meaning + "\n<" + $url + "|View run>")}')"
          curl --proto '=https' --tlsv1.2 -sSf --retry 3 \
            -X POST -H 'Content-Type: application/json' \
            -d "$payload" "$SLACK_WEBHOOK_URL"
