# End-to-end suite: downloads a released keenable binary (the same installer
# users run) and exercises every subcommand against the live API, plus
# semantic-relevance and latency checks. See tests/e2e/.
#
# Runs across Linux, macOS, and Windows so the released binary is exercised on
# every platform dist builds for. Unix installs via the shell installer;
# Windows installs via the PowerShell installer. The suite isolates each run
# under a temp dir via KEENABLE_HOME (HOME alone does not isolate on Windows,
# where dirs::home_dir() queries the real profile). The background daemon is
# Unix-only, so its tests self-skip on Windows; the shell-installer test does
# too (Windows installs via .ps1 in the matching CI step below).
#
# Not triggered by `release: published` — releases are created with
# GITHUB_TOKEN, which never triggers other workflows. Run it manually after a
# release, or wait for the nightly schedule.

name: E2E

on:
  workflow_dispatch:
    inputs:
      version:
        description: "CLI version to test (e.g. 0.1.16). Empty = latest release."
        required: false
        default: ""
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Run one OS at a time: all legs share a single KEENABLE_API_KEY, and
      # three jobs hammering the live API in parallel trips its rate limit.
      max-parallel: 1
      matrix:
        include:
          # Linux runs the whole suite, including the semantic-relevance and
          # latency checks against the live index.
          - os: ubuntu-latest
          # macOS and Windows verify the binary on their platform; the
          # semantic/latency checks are OS-independent, so skip them here
          # rather than hammering the live index on every matrix leg.
          - os: macos-latest
            markers: "not semantic and not latency"
          - os: windows-latest
            markers: "not semantic and not latency"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check API key secret
        shell: bash
        run: |
          if [ -z "${{ secrets.KEENABLE_API_KEY }}" ]; then
            echo "::error::KEENABLE_API_KEY secret is not set"
            exit 1
          fi

      - name: Install keenable CLI from GitHub Releases (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          # Via env, never interpolated into the script — a crafted dispatch
          # input must not be able to execute in a job that holds the API key.
          VERSION: ${{ inputs.version }}
        run: |
          BASE="https://github.com/keenableai/keenable-cli/releases"
          if [ -n "$VERSION" ]; then
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version must be plain semver (e.g. 0.1.16), got: $VERSION"
              exit 1
            fi
            URL="$BASE/download/v${VERSION}/keenable-cli-installer.sh"
            # Point the in-suite installer test at the same version under test.
            echo "KEENABLE_INSTALLER_URL=$URL" >> "$GITHUB_ENV"
          else
            URL="$BASE/latest/download/keenable-cli-installer.sh"
          fi
          curl --proto '=https' --tlsv1.2 -LsSf --retry 3 "$URL" | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install keenable CLI from GitHub Releases (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # Via env, never interpolated into the script — a crafted dispatch
          # input must not be able to execute in a job that holds the API key.
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $base = "https://github.com/keenableai/keenable-cli/releases"
          if ($env:VERSION) {
            if ($env:VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
              Write-Output "::error::version must be plain semver (e.g. 0.1.16), got: $env:VERSION"
              exit 1
            }
            $url = "$base/download/v$($env:VERSION)/keenable-cli-installer.ps1"
          } else {
            $url = "$base/latest/download/keenable-cli-installer.ps1"
          }
          irm $url | iex
          # install-path = CARGO_HOME, so the binary lands in ~\.cargo\bin.
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify installed binary
        run: keenable --version

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run e2e suite
        shell: bash
        env:
          KEENABLE_API_KEY: ${{ secrets.KEENABLE_API_KEY }}
          # Empty on Linux (full suite); "not semantic and not latency" on the
          # macOS/Windows legs so the OS-independent live-index checks run once.
          MARKERS: ${{ matrix.markers }}
          # KEENABLE_E2E_WRITE_FEEDBACK is deliberately NOT set: the
          # success-path feedback tests persist synthetic relevance data and
          # are opt-in only (run them locally or on a staging tenant).
        run: |
          # The shell-installer test and daemon tests self-skip on Windows via
          # pytest skipif, so the same invocation works on every platform.
          args=(-v -ra --color=yes)
          [ -n "$MARKERS" ] && args+=(-m "$MARKERS")
          uv run --project tests/e2e pytest tests/e2e "${args[@]}"

  # Alert Slack when any e2e leg does not succeed. Runs only on the nightly
  # schedule — manual dispatch is interactive, so the operator already sees the
  # result. `result != 'success'` covers both failures and cancellations (the
  # 30-min job timeout cancels rather than fails), so timed-out nightly runs
  # still alert. Needs the SLACK_WEBHOOK_URL repo secret (a Slack Incoming
  # Webhook URL; the target channel is fixed by the webhook). Self-skips if the
  # secret is unset.
  notify:
    name: notify-slack-on-failure
    needs: e2e
    if: ${{ always() && github.event_name == 'schedule' && needs.e2e.result != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Post failure to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL not set — skipping Slack alert"
            exit 0
          fi
          # Build the payload with jq so RUN_URL/REPO are JSON-escaped, never
          # interpolated into the shell or the JSON string by hand.
          payload="$(jq -n \
            --arg repo "$REPO" \
            --arg url "$RUN_URL" \
            '{text: ("🔴 Nightly e2e failed for *" + $repo + "*\n<" + $url + "|View run>")}')"
          curl --proto '=https' --tlsv1.2 -sSf --retry 3 \
            -X POST -H 'Content-Type: application/json' \
            -d "$payload" "$SLACK_WEBHOOK_URL"
