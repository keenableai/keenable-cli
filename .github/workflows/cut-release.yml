name: Cut release

# Includes the version so tools/release.sh can find the run it dispatched.
run-name: Cut release ${{ inputs.bump }}

# Automates the manual steps in RELEASE.md, with the default GITHUB_TOKEN only
# (no PAT).
#   1. Run this workflow (Actions -> Cut release -> Run workflow, on main) with a
#      bump. It pushes a release/vX.Y.Z branch that only touches Cargo.toml +
#      Cargo.lock, and dispatches CI on it.
#   2. A person opens the PR from that branch (tools/release.sh does steps
#      1-3 in one command) and merges it. The push to main tags vX.Y.Z and
#      dispatches release.yml on that tag (dist: binaries, installers, GitHub
#      Release, Homebrew formula).
#
# Why the workflow doesn't open the PR: main requires an approval, which the
# Qodo bridge (auto-approve.yml) gives as github-actions[bot]. A PR authored by
# that same bot could not be approved by it (an author can't approve their own
# PR), and creating PRs from Actions needs an admin setting. A PR opened by a
# person is approved by the bridge like any other.
#
# Why dispatch: events made with GITHUB_TOKEN (branch and tag pushes) trigger no
# other workflow, except workflow_dispatch. So CI on the branch and release.yml
# on the tag are started explicitly with `gh workflow run`. release.yml carries
# a hand-added workflow_dispatch trigger for this.
#
# Both jobs are safe to re-run after a partial failure: the branch job resumes
# an existing release branch, and the tag job only dispatches release.yml when
# no release or release run exists for the tag yet.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "patch, minor, major, or an exact version like 0.5.0 (prerelease suffixes like 0.5.0-beta.1 are fine)"
        required: true
        default: patch
  push:
    branches: [main]
    paths: [Cargo.toml]

permissions:
  contents: read

jobs:
  release-branch:
    name: Push release branch
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      # The release branch is cut from this checkout, so any other ref would
      # carry its unmerged changes into the release PR.
      - name: Require main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::run this workflow on main (got $GITHUB_REF)"
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Compute next version
        id: ver
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          cur=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          base=${cur%%-*}
          IFS=. read -r maj min pat <<<"$base"
          case "$BUMP" in
            patch) next="$maj.$min.$((pat + 1))" ;;
            minor) next="$maj.$((min + 1)).0" ;;
            major) next="$((maj + 1)).0.0" ;;
            *)
              if ! [[ "$BUMP" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                echo "::error::bump must be patch, minor, major or a semver like 1.2.3"
                exit 1
              fi
              next="$BUMP"
              ;;
          esac
          if [ "$next" = "$cur" ]; then
            echo "::error::Cargo.toml is already at $cur"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$next" >/dev/null; then
            echo "::error::tag v$next already exists"
            exit 1
          fi
          echo "current=$cur" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Bump Cargo.toml and Cargo.lock
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          perl -0pi -e 's/^version = ".*"$/version = "$ENV{NEXT}"/m' Cargo.toml
          cargo update --workspace
          git diff --stat

      - name: Push the release branch and run CI on it
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          branch="release/v$NEXT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A re-run after a failure further down finds the branch already
          # pushed; resume from it instead of pushing a second, divergent
          # commit. Only our own untouched branch is resumed: one bot commit
          # on top of this main that changes just the release files. Anything
          # else (main moved on, someone pushed to it) is not ours to reuse.
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null; then
            git fetch --quiet --depth=2 origin "$branch"
            extra=$(git diff --name-only HEAD FETCH_HEAD | grep -v -x -E 'Cargo\.toml|Cargo\.lock' || true)
            if [ "$(git rev-parse FETCH_HEAD^)" != "$(git rev-parse HEAD)" ] ||
              [ "$(git log -1 --format=%ae FETCH_HEAD)" != "41898282+github-actions[bot]@users.noreply.github.com" ] ||
              [ -n "$extra" ]; then
              echo "::error::$branch exists but is not one bot release commit on the current main (stale or edited). Delete it (git push origin --delete $branch) and re-run."
              exit 1
            fi
            echo "$branch already exists and is ours, resuming"
          else
            git checkout -b "$branch"
            git add Cargo.toml Cargo.lock
            git commit -m "chore: release $NEXT"
            git push origin "$branch"
          fi
          # A branch pushed with GITHUB_TOKEN triggers no CI; run it on the
          # branch so its checks show up on the PR head commit.
          gh workflow run ci.yml --ref "$branch"
          {
            echo "### Release branch \`$branch\` is ready"
            echo
            echo "Open the PR: https://github.com/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
            echo
            echo "Or run \`tools/release.sh\` to open, wait and merge it for you."
          } >> "$GITHUB_STEP_SUMMARY"

  tag:
    name: Tag release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One run per pushed commit. A shared group would drop a middle pending run
    # when three merges land at once, and nothing needs serializing: each push
    # only releases the version it changed, so two runs never share a tag.
    concurrency:
      group: cut-release-tag-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # history to read the pre-push version, and all tags

      - name: Tag a new version, then start its release
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          version_of() { sed -n 's/^version = "\(.*\)"$/\1/p' | head -1; }
          ver=$(version_of < Cargo.toml)
          prev=$(git show "$BEFORE:Cargo.toml" 2>/dev/null | version_of || true)
          # Cargo.toml also changes for dependency and metadata edits; only a
          # version change is a release.
          if [ "$ver" = "$prev" ]; then
            echo "version unchanged at $ver, nothing to release"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/v$ver" >/dev/null; then
            if [ "$(git rev-parse "v$ver^{commit}")" != "$GITHUB_SHA" ]; then
              echo "::error::tag v$ver already exists at another commit"
              exit 1
            fi
            echo "v$ver already tagged at this commit"
          else
            git tag "v$ver"
            git push origin "v$ver"
          fi

          # A tag pushed with GITHUB_TOKEN starts nothing, so start the release,
          # unless a run is going or succeeded. The run state, not the GitHub
          # Release, says whether publishing is done: dist creates the Release
          # early and can still fail after it (Homebrew), and a re-run must
          # resume that. This also avoids a double run after a manual tag.
          started=$(gh run list --workflow release.yml --branch "v$ver" --json status,conclusion \
            --jq '[.[] | select(.status != "completed" or .conclusion == "success")] | length')
          if [ "$started" != "0" ]; then
            echo "release.yml already running or succeeded for v$ver"
            exit 0
          fi
          gh workflow run release.yml --ref "v$ver"
