[project]
name = "keenable-cli-e2e"
version = "0.0.0"
description = "End-to-end test suite for the keenable CLI (runs against a released binary and the live API)"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8",
    "pyyaml>=6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
markers = [
    "latency: wall-clock latency checks (loose, tail-focused bounds)",
    "semantic: relevance checks against the live index",
]
