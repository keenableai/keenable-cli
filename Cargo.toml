[package]
name = "keenable-cli"
version = "0.2.3"
edition = "2024"
description = "Keenable CLI — authenticate, manage API keys, configure MCP, and search the web"
authors = ["grigorevp <grigoryev.pete@gmail.com>"]
repository = "https://github.com/keenableai/keenable-cli"
homepage = "https://keenable.ai"
publish = false

[package.metadata.dist]
dist = true

[[bin]]
name = "keenable"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# Trust both the bundled webpki roots and the platform store / SSL_CERT_FILE /
# SSL_CERT_DIR, so TLS-intercepting proxies work and minimal containers
# without a system store still do. See `api::build_client`.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "6"
open = "5"
colored = "2"
dialoguer = "0.11"
serde_yaml = "0.9"
toml = "1.1.2"
terminal_size = "0.4"
toml_edit = "0.25.12"
axoupdater = "0.10.2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[dev-dependencies]
http = "1"
# tests/tls_proxy.rs: a local TLS-intercepting proxy with a throwaway CA.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
